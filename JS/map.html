<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <script>
    let a = [1,2,3,4];
    let b=a.map((val)=>{
        return val+1;
    });
    let c= a.filter((val)=>{
        return val%2==0;
    });
    let d=a.reduce((cur,acc)=>{
        return cur+acc
    },0);
    console.log(b);
    console.log(c);
    console.log(d);
 </script>   
</body>
</html>
